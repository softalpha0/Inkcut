# Render Blueprint for Inkcut: web app + job queue (both free plans).
# The video worker runs on your own PC for now (`pnpm worker`, see README).
# To move it to Render later (~$7/month Starter plan), paste the commented
# block at the end of this file back under `services:`.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the dashboard and are never stored in git.
# All three services must be in the same region so they can talk privately.

services:
  # Next.js website, landing page and API (free plan sleeps after ~15 min idle).
  - type: web
    name: inkcut-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --filter "@inkcut/web..." && pnpm --filter @inkcut/web build
    startCommand: pnpm --filter @inkcut/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: inkcut-queue
          property: connectionString

  # Job queue (Redis-compatible). noeviction so queued jobs are never dropped.
  - type: keyvalue
    name: inkcut-queue
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    # Open to external connections so a worker on your PC can reach the queue.
    # Connections still need the password in the external Redis URL.
    # Set this back to [] once the worker runs on Render.
    ipAllowList:
      - source: 0.0.0.0/0
        description: worker on my PC

